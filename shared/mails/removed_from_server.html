<!doctype html>
<html lang="{{ language }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    <title>{{ subject }}</title>
    <style>
      @media (prefers-color-scheme: dark) {
        .canvas {
          background-color: #242424 !important;
        }
        .card {
          background-color: #2e2e2e !important;
          border-color: #424242 !important;
        }
        .bright {
          color: #ffffff !important;
        }
        .text {
          color: #c9c9c9 !important;
        }
        .subtle {
          color: #b8b8b8 !important;
        }
        .dimmed {
          color: #828282 !important;
        }
        .divider,
        .table,
        .row {
          border-color: #424242 !important;
        }
        .code {
          background-color: #242424 !important;
          border-color: #424242 !important;
          color: #ffffff !important;
        }
        .alert-yellow {
          background-color: #4d4228 !important;
        }
        .alert-green {
          background-color: #314434 !important;
        }
      }
    </style>
  </head>
  <body class="canvas" style="margin: 0; padding: 0; background-color: #f0eff0">
    <table
      role="presentation"
      class="canvas"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="background-color: #f0eff0"
    >
      <tr>
        <td align="center" style="padding: 40px 16px">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="max-width: 600px"
          >
            <tr>
              <td style="padding: 0 0 20px; text-align: center">
                <p
                  class="bright"
                  style="
                    margin: 0;
                    font-family: Helvetica, Arial, sans-serif;
                    font-size: 20px;
                    font-weight: 700;
                    color: #000000;
                  "
                >
                  {{ settings.app.name }}
                </p>
              </td>
            </tr>
            <tr>
              <td
                class="card"
                style="
                  padding: 32px 32px 16px;
                  background-color: #ffffff;
                  border: 1px solid #dee2e6;
                  border-radius: 8px;
                "
              >
                <h1
                  class="bright"
                  style="
                    margin: 0 0 16px;
                    font-family: Helvetica, Arial, sans-serif;
                    font-size: 22px;
                    font-weight: 700;
                    line-height: 1.35;
                    color: #000000;
                  "
                >
                  {{ vars.subject }}
                </h1>
                <p
                  class="text"
                  style="
                    margin: 0 0 16px;
                    font-family: Helvetica, Arial, sans-serif;
                    font-size: 14px;
                    line-height: 1.55;
                    color: #000000;
                  "
                >
                  {{ vars.greeting }}
                </p>
                <p
                  class="text"
                  style="
                    margin: 0 0 16px;
                    font-family: Helvetica, Arial, sans-serif;
                    font-size: 14px;
                    line-height: 1.55;
                    color: #000000;
                  "
                >
                  {{ vars.intro }}
                </p>
                <p
                  class="divider subtle"
                  style="
                    margin: 8px 0 16px;
                    padding-top: 16px;
                    border-top: 1px solid #dee2e6;
                    font-family: Helvetica, Arial, sans-serif;
                    font-size: 13px;
                    line-height: 1.55;
                    color: #495057;
                  "
                >
                  {{ vars.footer }}
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding: 16px 0 0; text-align: center">
                <a
                  class="dimmed"
                  href="{{ settings.app.url }}"
                  style="
                    font-family: Helvetica, Arial, sans-serif;
                    font-size: 12px;
                    color: #868e96;
                    text-decoration: none;
                  "
                >
                  {{ settings.app.url }}
                </a>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
