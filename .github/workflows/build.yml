name: Release Nightly

on:
  push:
    branches:
      - main

jobs:
  publish:
    name: Build and Publish
    uses: ./.github/workflows/build-and-publish.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    secrets: inherit
    with:
      image_tag: ${{ github.ref_name == 'main' && 'nightly' || 'next' }}
      wings_channel: nightly
