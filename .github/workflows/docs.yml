name: Deploy Docs to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  deploy-backend:
    name: Build and Deploy Backend Docs
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache: false

      - name: Dummy Frontend Files
        run: mkdir -p frontend/dist && echo "Dummy file" > frontend/dist/index.html

      - name: Build Crate Docs
        run: cargo doc --no-deps -p shared -p wings-api

      - name: Create Redirect
        run: echo "<meta http-equiv=\"refresh\" content=\"0; url=shared/index.html\">" > target/doc/index.html

      - name: Deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy target/doc --project-name=cratedocs
