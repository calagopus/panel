name: Lint

on:
  pull_request:
  push:
    branches:
      - "*"

jobs:
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11
          run_install: false

      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install

      - name: Run biome:validate
        run: |
          cd frontend
          pnpm run biome:validate

  lint-translations:
      name: Lint Translations
      runs-on: ubuntu-24.04
      permissions:
        contents: read
      steps:
        - name: Checkout sources
          uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

        - name: Setup Node.js
          uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
          with:
            node-version: "24"

        - name: Setup pnpm
          uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
          with:
            version: 11
            run_install: false

        - name: Install frontend dependencies
          run: |
            cd frontend
            pnpm install

        - name: Check translations
          run: |
            cd frontend
            failed_files=()
            for file in public/translations/*.json; do
              echo "Checking $file"
              pnpm diff:translations "$file" --check || failed_files+=("$file")
            done
            if [ ${#failed_files[@]} -gt 0 ]; then
              echo ""
              echo "Failed translations:"
              for f in "${failed_files[@]}"; do
                echo "  - $f"
              done
              exit 1
            fi

  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache: false

      - name: Dummy Frontend Files
        run: mkdir -p frontend/dist && echo "Dummy file" > frontend/dist/index.html
      
      - name: Run cargo fmt
        run: cargo fmt -- --check

      - name: Run cargo clippy
        run: cargo clippy
