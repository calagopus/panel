name: Lint

on:
  pull_request:
  push:
    branches:
      - "*"

jobs:
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-24.04
    if: github.ref_name != 'l10n_crowdin_translations' && github.head_ref != 'l10n_crowdin_translations'
    permissions:
      contents: read

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11
          run_install: false

      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install

      - name: Run biome:validate
        run: |
          cd frontend
          pnpm run biome:validate

  lint-translations:
    name: Lint Translations
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11
          run_install: false

      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install

      - name: Check translations
        run: |
          cd frontend
          failed_files=()
          for file in public/translations/*.json; do
            echo "Checking $file"
            pnpm diff:translations "$file" --check || failed_files+=("$file")
          done
          if [ ${#failed_files[@]} -gt 0 ]; then
            echo ""
            echo "Failed translations:"
            for f in "${failed_files[@]}"; do
              echo "  - $f"
            done
            exit 1
          fi

  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-24.04
    if: github.ref_name != 'l10n_crowdin_translations' && github.head_ref != 'l10n_crowdin_translations'
    permissions:
      contents: read

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache: false

      - name: Dummy Frontend Files
        run: mkdir -p frontend/dist && echo "Dummy file" > frontend/dist/index.html

      - name: Run cargo fmt
        run: cargo fmt -- --check

      - name: Run cargo clippy
        run: cargo clippy

  test-backend:
    name: Test Backend
    runs-on: ubuntu-24.04
    if: github.ref_name != 'l10n_crowdin_translations' && github.head_ref != 'l10n_crowdin_translations'
    permissions:
      contents: read

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: stable
          cache-key: test-backend

      - name: Dummy Frontend Files
        run: |
          mkdir -p frontend/dist/translations
          echo "Dummy file" > frontend/dist/index.html
          echo "{}" > frontend/dist/translations/en.json
          echo "{}" > frontend/dist/translations/de.json

      - name: Run cargo test
        run: cargo test --workspace --exclude panel-rs-aio
