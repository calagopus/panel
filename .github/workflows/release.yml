name: Release

on:
  push:
    tags:
      - "release-*"

env:
  PROJECT_NAME: panel-rs

jobs:
  release-info:
    name: Determine Release Info
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.info.outputs.version }}
      is_prerelease: ${{ steps.info.outputs.is_prerelease }}
      is_latest_stable: ${{ steps.info.outputs.is_latest_stable }}
      is_latest_overall: ${{ steps.info.outputs.is_latest_overall }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine version info
        id: info
        run: |
          RAW_TAG="${{ github.ref_name }}"
          VERSION="${RAW_TAG#release-}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # A tag is only allowed to move the "latest" markers if it is
          # actually the newest published version.
          LATEST_STABLE=$(git tag -l 'release-*' | sed 's/^release-//' | grep -vF -- '-' | sort -V | tail -n1)
          LATEST_OVERALL=$(git tag -l 'release-*' | sed 's/^release-//; s/-/~/' | sort -V | sed 's/~/-/' | tail -n1)

          if [[ "$VERSION" == *-* ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "is_latest_stable=false" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            if [[ "$VERSION" == "$LATEST_STABLE" ]]; then
              echo "is_latest_stable=true" >> $GITHUB_OUTPUT
            else
              echo "is_latest_stable=false" >> $GITHUB_OUTPUT
            fi
          fi

          if [[ "$VERSION" == "$LATEST_OVERALL" ]]; then
            echo "is_latest_overall=true" >> $GITHUB_OUTPUT
          else
            echo "is_latest_overall=false" >> $GITHUB_OUTPUT
          fi

  publish:
    name: Build and Publish
    needs: [release-info]
    uses: ./.github/workflows/build-and-publish.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    secrets: inherit
    with:
      image_tag: ${{ needs.release-info.outputs.version }}
      tag_latest: ${{ needs.release-info.outputs.is_latest_stable == 'true' }}
      tag_latest_pre: ${{ needs.release-info.outputs.is_latest_overall == 'true' }}
      wings_channel: release
      windows: true

  publish-draft-release:
    name: Publish Draft Release
    needs: [release-info, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Create Draft Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ needs.release-info.outputs.version }}
          draft: true
          prerelease: ${{ needs.release-info.outputs.is_prerelease == 'true' }}
          make_latest: ${{ needs.release-info.outputs.is_latest_stable }}
          generate_release_notes: true
          files: |
            artifacts/${{ env.PROJECT_NAME }}-*/*
            artifacts/sbom-source.cyclonedx.json/sbom-source.cyclonedx.json
