name: Crowdin Action

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'frontend/public/translations/en.json'
      - 'shared/mails/variables/en.json'
      - '.github/workflows/crowdin.yml'
      - '.github/scripts/strip_untranslated_translations.py'
      - 'crowdin.yml'
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: write
  pull-requests: write

jobs:
  crowdin:
    runs-on: ubuntu-latest
    env:
      TRANSLATION_DIRS: >-
        frontend/public/translations
        shared/mails/variables

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Synchronize with Crowdin
        uses: crowdin/github-action@959dc74ac104447731cba99a016f85d0ae719788 # v3.5.0
        with:
          upload_sources: true
          upload_translations: false
          download_translations: true
          localization_branch_name: l10n_crowdin_translations

          push_translations: false
          create_pull_request: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
          run_install: false

      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install

      - name: Strip and fix translations
        run: |
          changed=$( (git diff --name-only -- $TRANSLATION_DIRS; git ls-files --others --exclude-standard -- $TRANSLATION_DIRS) | sort -u | grep -v '/en\.json$' || true)

          echo 'New Crowdin pull request with translations' > /tmp/pr-body.md

          if [ -z "$changed" ]; then
            echo "No downloaded translation files changed."
            exit 0
          fi

          # Drop strings Crowdin filled in with the untranslated source text.
          python3 .github/scripts/strip_untranslated_translations.py $changed

          # Drop strings that fail validation (variable mismatch, or a key not
          # present in the source language), tracking what got removed.
          fixed_log=/tmp/fixed-translations.log
          : > "$fixed_log"
          for file in $changed; do
            if [[ "$file" == frontend/public/translations/*.json && -f "$file" ]]; then
              (cd frontend && pnpm run diff:translations "${file#frontend/}" --fix) | tee -a "$fixed_log"
            fi
          done

          if grep -q '^REMOVED' "$fixed_log"; then
            {
              echo ''
              echo '### Removed translation keys'
              echo ''
              echo 'These keys failed validation (variable mismatch, or not present in the source language) and were stripped:'
              echo ''
              grep '^REMOVED' "$fixed_log" | awk -F'\t' '{ printf "- `%s`: `%s` (%s)\n", $2, $3, $4 }' | sort -u
            } >> /tmp/pr-body.md
          fi

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          branch: l10n_crowdin_translations
          base: main
          title: 'New Crowdin translations'
          body-path: /tmp/pr-body.md
          commit-message: 'New Crowdin translations'
