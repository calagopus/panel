name: Crowdin Action

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'frontend/public/translations/en.json'
      - 'shared/mails/variables/en.json'
      - '.github/workflows/crowdin.yml'
      - 'crowdin.yml'
  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: write
  pull-requests: write

jobs:
  crowdin:
    runs-on: ubuntu-latest
    env:
      TRANSLATION_DIRS: >-
        frontend/public/translations
        shared/mails/variables
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Synchronize with Crowdin
        uses: crowdin/github-action@v3
        with:
          upload_sources: true
          upload_translations: false
          download_translations: true
          localization_branch_name: l10n_crowdin_translations

          push_translations: false
          create_pull_request: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

      - name: Strip untranslated strings
        run: |
          changed=$(git diff --name-only -- $TRANSLATION_DIRS | grep -v '/en\.json$' || true)
          if [ -n "$changed" ]; then
            python3 .github/scripts/strip_untranslated_translations.py $changed
          else
            echo "No downloaded translation files changed."
          fi

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: l10n_crowdin_translations
          base: main
          title: 'New Crowdin translations'
          body: 'New Crowdin pull request with translations'
          commit-message: 'New Crowdin translations'
